app:
  name: Binance Spot Testnet BTC Trading Bot
  language: tr
simulation:
  collateral_usdt: 100.0
  leverage: 1
  target_net_profit_usdt: 10.0
  fee_rate: 0.001
  slippage_bps: 2.0
  max_daily_loss_usdt: 5.0
  trading_enabled: false
  testnet: true
  order_quote_usdt: 50.0
  take_profit_pct: 0.008
  stop_loss_pct: 0.004
  candle_interval: 5m
  higher_interval: 15m
  poll_seconds: 15
  ema_fast_period: 9
  ema_slow_period: 21
  rsi_period: 14
  min_imbalance: 0.10
  cooldown_seconds: 300
  max_trades_per_day: 20
market:
  default_symbol: BTCUSDT
  depth_levels: 50
  stale_data_seconds: 5
storage:
  database: data/trades.sqlite3
